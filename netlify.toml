[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── SPA fallback: path ที่ไม่ใช่ไฟล์จริง → index.html (React Router) ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── security headers ทั้งเว็บ ──
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: https://lh3.googleusercontent.com; connect-src 'self' https://lvmytvdruufgfvijmjhl.supabase.co wss://lvmytvdruufgfvijmjhl.supabase.co; worker-src 'self'; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── อย่า cache service worker ──
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
